# Netlify: the game is a ready static page in toshkent-drive/ (index.html is committed already built), so there is no build step.
[build]
  publish = "toshkent-drive"
  command = ""

# the page and service worker are re-checked on every visit, so a new version reaches players at once
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
# car models, decoder and media change rarely
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/draco/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
